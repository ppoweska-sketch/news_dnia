name: Codzienny przegląd wiadomości

on:
  schedule:
    # Cel: raport gotowy ok. 9:00-10:00 czasu warszawskiego, TYLKO dni robocze
    # (pon-pt = "1-5" w polu dnia tygodnia crona).
    #
    # UWAGA: GitHub Actions potrafi opóźniać zaplanowane uruchomienia —
    # zaobserwowane (11-13 sierpnia 2026): konsekwentnie 3,5-4,5h opóźnienia.
    # Ten wpis (4:50 UTC = 6:50 latem/7:50 zimą w Warszawie) uwzględnia to
    # opóźnienie z zapasem, celując w realne wykonanie ok. 8:30-10:30.
    # To szacunek na podstawie 2 dni obserwacji, nie gwarancja — jeśli po
    # tygodniu raport regularnie wychodzi poza 9-10, dostosuj tę godzinę.
    #
    # Celowo BEZ popołudniowego wpisu zapasowego: raport ma sens tylko rano
    # (użytkownik czyta go przed/w trakcie dnia) — gdyby poranny przebieg
    # zawiódł, popołudniowy "dogonienie" i tak nie spełniłoby celu. Lepiej
    # poczekać do jutrzejszego porannego niż wygenerować raport po południu.
    - cron: "50 4 * * 1-5"
  workflow_dispatch:      # przycisk "Run workflow" do testów ręcznych, o dowolnej porze/dniu

# Bez tego wbudowany GITHUB_TOKEN jest tylko do odczytu i push się nie uda.
permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź, czy raport dziś już powstał
        id: pora
        run: |
          # Nie pilnujemy godziny (GitHub potrafi opóźniać cron o kilka
          # godzin, patrz komentarz przy "on: schedule" wyżej) — pilnujemy
          # tylko, żeby nie wygenerować dwa razy tego samego dnia. Datę
          # ostatniego raportu czytamy z ostatniego commita do docs/index.html,
          # licząc w czasie warszawskim (ten sam commit w UTC mógłby wypaść
          # na wczoraj/dziś w zależności od pory).
          DZIS=$(TZ=Europe/Warsaw date +%Y-%m-%d)
          DZIEN_TYGODNIA=$(TZ=Europe/Warsaw date +%u)   # 1=poniedziałek ... 7=niedziela
          if [ -f docs/index.html ]; then
            OSTATNI=$(TZ=Europe/Warsaw git log -1 --format=%cd --date=format-local:%Y-%m-%d -- docs/index.html)
          else
            OSTATNI="(brak raportu)"
          fi
          echo "Dziś (Warszawa): $DZIS, dzień tygodnia: $DZIEN_TYGODNIA. Ostatni raport: $OSTATNI."

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Uruchomienie ręczne — generuję niezależnie od daty i dnia tygodnia."
            echo "uruchom=tak" >> "$GITHUB_OUTPUT"
          elif [ "$DZIEN_TYGODNIA" -ge 6 ]; then
            # Pole dnia tygodnia w cronie ("1-5") powinno to wykluczyć samo,
            # ale przy wystarczająco dużym opóźnieniu piątkowy przebieg
            # mógłby w teorii wykonać się już w sobotę — druga, niezależna
            # warstwa tego samego zabezpieczenia.
            echo "Weekend w Warszawie — pomijam (raport tylko w dni robocze)."
            echo "uruchom=nie" >> "$GITHUB_OUTPUT"
          elif [ "$OSTATNI" = "$DZIS" ]; then
            echo "Dzisiejszy raport już istnieje — pomijam, żeby nie generować drugi raz."
            echo "uruchom=nie" >> "$GITHUB_OUTPUT"
          else
            echo "Brak dzisiejszego raportu, dzień roboczy — generuję."
            echo "uruchom=tak" >> "$GITHUB_OUTPUT"
          fi

      - name: Ustaw Pythona
        if: steps.pora.outputs.uruchom == 'tak'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zainstaluj zależności
        if: steps.pora.outputs.uruchom == 'tak'
        run: pip install -r requirements.txt

      - name: Sprawdź kanały RSS
        if: steps.pora.outputs.uruchom == 'tak'
        continue-on-error: true   # padnięty kanał to ostrzeżenie, nie powód do przerwania
        run: python check_feeds.py

      - name: Wygeneruj i opublikuj raport
        if: steps.pora.outputs.uruchom == 'tak'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO_DIR: ${{ github.workspace }}
          SITE_SUBDIR: docs          # strona ląduje w docs/, kod zostaje w korzeniu
          GITHUB_BRANCH: ${{ github.ref_name }}
          NEWS_SOURCE: rss
          ANTHROPIC_MODEL: claude-sonnet-5
          ANTHROPIC_EFFORT: medium
          ANTHROPIC_MAX_TOKENS: "40000"
        run: |
          git config user.name "Daily News Bot"
          git config user.email "bot@users.noreply.github.com"
          python generate_report.py

      - name: Zachowaj log przy błędzie
        if: failure() && steps.pora.outputs.uruchom == 'tak'
        uses: actions/upload-artifact@v4
        with:
          name: log-bledu
          path: logs/
          retention-days: 7
